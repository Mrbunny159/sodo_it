name: sodo_it
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.2
  riverpod_annotation: ^2.3.3

  # Local Database (Drift / SQLite)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20

  # File System Helpers
  path_provider: ^2.1.3
  path: ^1.9.0

  # Theme Storage
  shared_preferences: ^2.2.3

  # Export / Import (Dependency conflict resolved)
  file_picker: ^8.0.3
  share_plus: ^12.0.2

  # UI & Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1  # YEH LINE ADD KARNI HAI
  flutter_native_splash: ^2.4.0   # YEH LINE ADD KARNI HAI

  # Code Generation Tools
  build_runner: ^2.4.9
  drift_dev: ^2.16.0
  riverpod_generator: ^2.3.9

  # Lints
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter_native_splash:
  color: "#ffffff" # Background color of the splash screen (White)
  image: "assets/app_icon.png" # We will reuse the same logo
  android_12:
    color: "#ffffff"
    image: "assets/app_icon.png"